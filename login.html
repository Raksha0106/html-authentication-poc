<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="center-box">
<div class="card p-4 custom-card" style="width:350px;">

<h3 class="text-center mb-3">Login</h3>

<div class="mb-3">
<label>Username</label>
<input type="text" class="form-control" placeholder="Enter username">
</div>

<div class="mb-3">
<label>Password</label>

<div class="input-group">
<input type="password" id="loginPass" class="form-control" placeholder="Enter password">
<span class="input-group-text" onclick="togglePassword('loginPass')">
<i class="bi bi-eye"></i>
</span>
</div>

</div>

<button class="btn btn-custom w-100 mb-2">Login</button>

<div class="text-center">
<a href="register.html">Create Account</a><br>
<a href="forgot-password.html">Forgot Password?</a>
</div>

</div>
</div>

<script src="script.js"></script>

</body>
</html>
